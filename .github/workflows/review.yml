name: AI Code Review

# Self-contained: builds and runs this repo's own API inside the job, then has it review (and
# post inline comments on) the pull request that triggered the run. No hosted instance required.
#
# Limitation: on pull requests from forks, GitHub only grants GITHUB_TOKEN read access, so the
# "post to GitHub" call below will fail with 403 regardless of the `permissions` block — the
# workflow still runs and logs findings, it just can't post inline comments for fork PRs.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build --configuration Release

      - name: Start the review API and wait for it to be ready
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ASPNETCORE_URLS: http://localhost:5099
        run: |
          dotnet run --no-build --configuration Release --project src/AI.CodeReview.Api &

          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:5099/api/reviews -X POST -H "Content-Type: application/json" -d '{}'; then
              echo "API is up"
              exit 0
            fi
            sleep 1
          done

          echo "API did not start in time" >&2
          exit 1

      - name: Review this pull request and post findings
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_REVIEW_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          payload=$(jq -n --arg url "$PR_URL" --arg token "$GH_REVIEW_TOKEN" \
            '{gitUrl: $url, postToGitHub: true, gitHubToken: $token}')

          response=$(curl -sf http://localhost:5099/api/reviews \
            -X POST -H "Content-Type: application/json" -d "$payload")

          echo "$response" | jq .

          if [ "$(echo "$response" | jq -r '.gitHubPublish.posted')" != "true" ]; then
            echo "::warning::Could not post the review to GitHub: $(echo "$response" | jq -r '.gitHubPublish.error')"
          fi
